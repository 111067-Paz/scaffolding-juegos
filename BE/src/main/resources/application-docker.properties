# ── DOCKER profile: PostgreSQL (activated by SPRING_PROFILES_ACTIVE=docker) ──
# Every value comes from docker-compose.yml / .env — nothing secret lives here.
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${POSTGRES_DB:p4}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER:p4}
spring.datasource.password=${POSTGRES_PASSWORD:p4}
# update: the schema (and every game) survives container restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false
spring.sql.init.mode=never
