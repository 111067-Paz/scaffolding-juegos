spring.application.name=p4

# ── DEV profile (default): H2 in memory ────────────────────────────
# create-drop: clean schema on every start. Game data does NOT survive a restart
# here on purpose; the 'docker' profile (application-docker.properties) uses
# PostgreSQL + update so games DO survive container restarts.
spring.datasource.url=jdbc:h2:mem:p4db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Lazy relations are resolved INSIDE the service (JOIN FETCH), never in the view.
spring.jpa.open-in-view=false
# Console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:p4db)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Actuator: health probes used by docker-compose healthcheck ────
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ── JWT (basic, no Spring Security) ────────────────────────────────
# Dev-only defaults. In docker they come from environment variables (.env),
# NEVER a real secret committed to git. HS256 needs >= 32 bytes.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-key-for-p4-at-least-32-bytes}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:60}
# HttpOnly auth cookie. secure=true only when served over HTTPS.
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
